# GitHub Actions workflow for building Flutter app for Linux using FVM
# This workflow uses the version specified in .fvm/fvm_config.json or .fvmrc

name: Build Flutter Linux App

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main, publish ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main, publish ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-linux:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for gh-describe to find tags

      - name: Install Ubuntu dependencies
        if: runner.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa mesa-utils

      - name: Install Ubuntu dependencies
        if: runner.os == 'linux'
        run: |
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev lld git


      - name: Git describe
        id: ghd
        run: |
          echo "tag=$(git describe --always --tags --dirty)" >> "$GITHUB_OUTPUT"

      - name: Git semver
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          desc="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long --dirty --always)"
          if [[ "$desc" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-0-g([0-9a-f]+)(-dirty)?$ ]]; then
            version="${BASH_REMATCH[1]}"
            if [[ -n "${BASH_REMATCH[3]:-}" ]]; then
              version="${version}+dirty.${BASH_REMATCH[2]}"
            fi
          elif [[ "$desc" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
            version="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}+${BASH_REMATCH[3]}"
            if [[ -n "${BASH_REMATCH[4]:-}" ]]; then
              version="${version}.dirty"
            fi
          else
            version="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - run: |
          echo "y" | sdkmanager "ndk;29.0.14033849" # Replace with your required NDK version
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r29'
          link-to-sdk: true

      - uses: kuhnroyal/flutter-fvm-config-action/config@v3
        with:
          path: '.fvmrc'

      - name: Setup Flutter (with cache)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: beta
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Version
        run: flutter doctor


      - name: Install Flutter dependencies
        run: flutter pub get

      # - name: Cache Gradle
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #       ~/.android/build-cache
      #     key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      #     restore-keys: |
      #       gradle-${{ runner.os }}-

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build for Linux
        run: flutter build linux --release

      - name: Upload Linux build artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          version: ${{ steps.semver.outputs.version }}
          append-max-detail-suffix: true

      - name: Build for Android
        run: flutter build apk --release

      - name: List for Android
        run: ls -R build/app/outputs

      - name: Upload Android build artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          version: ${{ steps.semver.outputs.version }}
          append-max-detail-suffix: true
