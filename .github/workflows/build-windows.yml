# GitHub Actions workflow for building Flutter app for Windows using FVM

name: Build Flutter Windows App

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, publish ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main, publish ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-windows:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for gh-describe to find tags

      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@v2

      - name: Git semver
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          desc="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long --dirty --always)"
          if [[ "$desc" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-0-g([0-9a-f]+)(-dirty)?$ ]]; then
            version="${BASH_REMATCH[1]}"
            if [[ -n "${BASH_REMATCH[3]:-}" ]]; then
              version="${version}+dirty.${BASH_REMATCH[2]}"
            fi
          elif [[ "$desc" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$ ]]; then
            version="${BASH_REMATCH[1]}-dev.${BASH_REMATCH[2]}+${BASH_REMATCH[3]}"
            if [[ -n "${BASH_REMATCH[4]:-}" ]]; then
              version="${version}.dirty"
            fi
          else
            version="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: kuhnroyal/flutter-fvm-config-action/config@v3
        with:
          path: '.fvmrc'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: beta
          cache: true

      - name: Version
        run: flutter doctor

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build for Windows
        run: flutter build windows --release

      - name: Upload Windows build artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          version: ${{ steps.semver.outputs.version }}
          append-max-detail-suffix: true
