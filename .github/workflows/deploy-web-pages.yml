name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches: [main, publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebAssembly app
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install native-assets build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build

      - name: Select matching LLVM and Clang CMake packages
        shell: bash
        run: |
          set -euo pipefail
          llvm_dir="$(llvm-config --cmakedir)"
          clang_dir="${llvm_dir%/llvm}/clang"
          test -f "$llvm_dir/LLVMConfig.cmake"
          test -f "$clang_dir/ClangConfig.cmake"
          echo "LLVM_DIR=$llvm_dir" >> "$GITHUB_ENV"
          echo "Clang_DIR=$clang_dir" >> "$GITHUB_ENV"
          echo "Using LLVM_DIR=$llvm_dir"
          echo "Using Clang_DIR=$clang_dir"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Wasm browser tests
        run: flutter test --platform chrome --wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Wasm release
        run: >-
          flutter build web --wasm --release --no-pub
          --base-href "/${{ github.event.repository.name }}/"

      - name: Verify TinyExpr++ Wasm assets
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/assets/packages/tinyexpr_plusplus_ffi/lib/tinyexprpp.wasm
          test -f build/web/assets/packages/tinyexpr_plusplus_ffi/lib/tinyexprpp_loader.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
