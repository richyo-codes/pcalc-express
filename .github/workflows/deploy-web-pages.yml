name: Deploy WebAssembly to GitHub Pages

on:
  push:
    branches: [main, publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebAssembly app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter web
        run: flutter config --enable-web

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Wasm browser tests
        run: flutter test --platform chrome --wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Wasm release
        run: >-
          flutter build web --wasm --release --no-pub
          --base-href "/${{ github.event.repository.name }}/"

      - name: Verify TinyExpr++ Wasm assets
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/assets/packages/tinyexpr_plusplus_ffi/lib/tinyexprpp.wasm
          test -f build/web/assets/packages/tinyexpr_plusplus_ffi/lib/tinyexprpp_loader.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
