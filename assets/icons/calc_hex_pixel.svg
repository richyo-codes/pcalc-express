<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Retro pixel-style calculator with HEX overlay -->
  <rect x="80" y="64" width="352" height="384" fill="#0F172A" stroke="#38BDF8" stroke-width="10"/>
  <!-- Screen -->
  <rect x="112" y="96" width="288" height="112" fill="#1E293B" stroke="#38BDF8" stroke-width="6"/>
  <text x="128" y="162" font-family="monospace" font-size="40" fill="#93C5FD">0xBEEF</text>
  <!-- Pixel buttons (4x4 grid) -->
  <g fill="#E2E8F0">
    <rect x="112" y="232" width="64" height="48"/>
    <rect x="192" y="232" width="64" height="48"/>
    <rect x="272" y="232" width="64" height="48"/>
    <rect x="352" y="232" width="48" height="48"/>
    
    <rect x="112" y="288" width="64" height="48"/>
    <rect x="192" y="288" width="64" height="48"/>
    <rect x="272" y="288" width="64" height="48"/>
    <rect x="352" y="288" width="48" height="48"/>
    
    <rect x="112" y="344" width="64" height="48"/>
    <rect x="192" y="344" width="64" height="48"/>
    <rect x="272" y="344" width="64" height="48"/>
    <rect x="352" y="344" width="48" height="104"/>
    
    <rect x="112" y="400" width="144" height="48"/>
    <rect x="272" y="400" width="64" height="48"/>
  </g>
  <!-- HEX ribbon -->
  <g transform="translate(300 58)">
    <rect x="0" y="0" width="132" height="36" fill="#22C55E"/>
    <polygon points="132,0 160,18 132,36" fill="#16A34A"/>
    <text x="10" y="24" font-family="monospace" font-size="22" fill="#052e10">HEX MODE</text>
  </g>
</svg>
