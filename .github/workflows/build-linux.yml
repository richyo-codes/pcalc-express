# GitHub Actions workflow for building Flutter app for Linux using FVM
# This workflow uses the version specified in .fvm/fvm_config.json or .fvmrc

name: Build Flutter Linux App

on:
  push:
    branches: [ main, publish ]
  pull_request:
    branches: [ main, publish ]

env:
  FLUTTER_CHANNEL: 'beta'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@v2

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: apt-linux-${{ runner.os }}-${{ hashFiles('.github/workflows/build-linux.yml') }}

      - name: Install Ubuntu dependencies
        if: runner.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa

      - name: Install Ubuntu dependencies
        if: runner.os == 'linux'
        run: |
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev lld

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: |
          echo "y" | sdkmanager "ndk;26.2.11394342" # Replace with your required NDK version
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r26d' # Specify the NDK version your project requires
          link-to-sdk: true # Link the NDK to the Android SDK

      - uses: kuhnroyal/flutter-fvm-config-action/config@v3
        with:
          path: '.fvmrc'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: beta
          cache: true
          # optional parameters follow
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache of dart pub get dependencies
          pub-cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path

      - name: Version
        run: flutter doctor


      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build for Linux
        run: flutter build linux --release

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/



      - name: Build for Android
        run: flutter build apk --release

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

