app-id: ca.richyoung.pcalcexpress
branch: gtk4
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: run-pcalc-express
build-options:
  # Preserve prebuilt ELF files: SDK debuginfo extraction can damage the
  # program headers relocated by patchelf when adding a RUNPATH.
  no-debuginfo: true
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --share=ipc

modules:
  - name: pcalc-express
    buildsystem: simple
    sources:
      - type: dir
        path: ../build/linux-gtk4/x64/release/bundle
        dest: bundle
      - type: dir
        path: .
        dest: flatpak
      - type: dir
        path: ../assets/icons
        dest: icons
      - type: file
        path: ../LICENSE
    build-commands:
      - install -Dm755 bundle/pcalc_express /app/bin/pcalc_express
      - cp -r bundle/data /app/bin/
      - cp -r bundle/lib /app/bin/
      - install -Dm644 LICENSE /app/share/licenses/ca.richyoung.pcalcexpress/LICENSE
      - |
        cat > /app/bin/run-pcalc-express <<'EOF'
        #!/usr/bin/env sh
        export LD_LIBRARY_PATH="/app/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec /app/bin/pcalc_express "$@"
        EOF
      - chmod 755 /app/bin/run-pcalc-express
      - install -Dm644 flatpak/ca.richyoung.pcalcexpress.desktop /app/share/applications/ca.richyoung.pcalcexpress.desktop
      - install -Dm644 flatpak/ca.richyoung.pcalcexpress.metainfo.xml /app/share/metainfo/ca.richyoung.pcalcexpress.metainfo.xml
      - install -Dm644 icons/app_icon_256.png /app/share/icons/hicolor/256x256/apps/ca.richyoung.pcalcexpress.png
      - install -Dm644 icons/app_icon_512.png /app/share/icons/hicolor/512x512/apps/ca.richyoung.pcalcexpress.png
