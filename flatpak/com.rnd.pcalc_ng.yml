app-id: com.rnd.pcalc_ng
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: run-rnd-pcalc-ng
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --share=ipc

modules:
  - name: rnd-pcalc-ng
    buildsystem: simple
    sources:
      - type: dir
        path: ../build/linux/x64/release/bundle
        dest: bundle
      - type: dir
        path: .
        dest: flatpak
      - type: dir
        path: ../assets/icons
        dest: icons
    build-commands:
      - install -Dm755 bundle/rnd_pcalc_ng /app/bin/rnd_pcalc_ng
      - cp -r bundle/data /app/bin/
      - cp -r bundle/lib /app/bin/
      - |
        cat > /app/bin/run-rnd-pcalc-ng <<'EOF'
        #!/usr/bin/env sh
        export LD_LIBRARY_PATH="/app/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        exec /app/bin/rnd_pcalc_ng "$@"
        EOF
      - chmod 755 /app/bin/run-rnd-pcalc-ng
      - install -Dm644 flatpak/com.rnd.pcalc_ng.desktop /app/share/applications/com.rnd.pcalc_ng.desktop
      - install -Dm644 flatpak/com.rnd.pcalc_ng.metainfo.xml /app/share/metainfo/com.rnd.pcalc_ng.metainfo.xml
      - install -Dm644 icons/calc_hex_badge.svg /app/share/icons/hicolor/scalable/apps/com.rnd.pcalc_ng.svg
